name: ESO smoke test

on:
  push:
    branches:
      - eso-restructure
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas scikit-learn statsmodels nolds matplotlib pyarrow pytest
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric

      - name: Compile ESO
        run: |
          python -m py_compile \
            eso/__init__.py \
            eso/cli.py \
            eso/pipeline.py \
            eso/data/*.py \
            eso/diagnostics/*.py \
            eso/topology/*.py \
            eso/meta/*.py \
            eso/reporting/*.py \
            experiments/01_diagnose_btc.py \
            experiments/02_test_manifolds.py \
            tests/*.py

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run legacy experiment smokes
        run: |
          python -u experiments/01_diagnose_btc.py --n 256
          python -u experiments/02_test_manifolds.py --dataset harmonic --n 256 --manifolds circle sphere2 torus2 --k 6

      - name: Run agent-ready CLI inspect and diagnose
        run: |
          python -m eso.cli inspect examples/harmonic.csv --columns x y --output reports/harmonic_inspect.json
          python -m eso.cli diagnose examples/harmonic.csv --columns x y --output reports/harmonic_diagnosis.json

      - name: Run agent-ready CLI explore
        run: |
          python -m eso.cli explore examples/harmonic.csv \
            --dataset-id harmonic_example \
            --columns x y \
            --max-rows 64 \
            --manifolds circle sphere2 torus2 \
            --k 6 \
            --n-masks 3 \
            --output reports/harmonic_eso \
            --no-registry

      - name: Verify report artifacts
        run: |
          test -f reports/harmonic_eso/report.html
          test -f reports/harmonic_eso/report.md
          test -f reports/harmonic_eso/report.json
          test -f reports/harmonic_eso/metrics.csv
          test -f reports/harmonic_eso/diagnosis.json
          test -f reports/harmonic_eso/figures/manifold_ranking.png
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/harmonic_eso/report.json').read_text())
          assert payload['schema_version'] == 'eso.report.v1'
          assert payload['best']['manifold']
          assert payload['agent_summary']['recommended_next_action']
          PY

      - name: Upload ESO report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eso-harmonic-report
          path: reports/harmonic_eso
